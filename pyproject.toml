[project]
name = "pytest-feature-coverage"
version = "0.1.0"
description = "A pytest plugin that connects tests to requirements defined in YAML feature files and produces deterministic coverage reports"
authors = [{name = "Matt Callaway", email = "matt.callaway@bayer.com"}]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "pytest>=7.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.entry-points.pytest11]
feature_coverage = "pytest_feature_coverage.plugin"

[dependency-groups]
dev = [
    "mdformat>=1.0.0,<2",
    "mdformat-frontmatter>=2.0.0",
    "mdformat-gfm>=0.4.0",
    "packaging>=24.0",
    "pytest>=8.4.2,<9",
    "ruff>=0.11,<1",
    "ty>=0.0.1a0",
]

[tool.uv]

[[tool.uv.index]]
name = "shared-python-prod-shared"
url = "https://artifactory.bayer.com/artifactory/api/pypi/shared-python-prod-shared/simple"
publish-url = "https://artifactory.bayer.com/artifactory/api/pypi/shared-python-prod-shared"
explicit = true

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_feature_coverage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules and mccabe complexity (`C901`)
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C901",
    "COM",  # flake8-commas (trailing commas)
    "ISC",  # flake8-implicit-str-concat
    "TCH",  # flake8-type-checking (imports in TYPE_CHECKING)
    "D300", # pydocstyle: use triple double quotes
]

# Avoid enforcing line-length violations (`E501`)
# COM812 and ISC001 conflict with the ruff formatter (it handles these itself)
ignore = ["E501", "COM812", "ISC001"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# TCH auto-fixes move imports into TYPE_CHECKING. This is safe when annotations
# are not evaluated at runtime (e.g., no Pydantic models, no isinstance on types).
# Disable this if you add runtime annotation consumers -- Pydantic models need
# their annotations at runtime, so we exclude schema.py from TCH fixes.
extend-safe-fixes = ["TCH"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
# 5. Use single quotes in `ruff format`.
quote-style = "single"

## -- End Ruff configuration

[tool.ty.environment]
python-version = "3.14"
