# Require mise 2025.8.11+ for #MISE task syntax support
min_version = '2025.8.11'

[tools]
python = '3.14'
uv = 'latest'
# Node is required for npm:markdownlint-cli2 (no native alternative).
node = 'latest'
pre-commit = 'latest'
gitleaks = 'latest'
"npm:markdownlint-cli2" = 'latest'
"pipx:mdformat" = { version = "latest", uvx_args = "--with mdformat-frontmatter --with mdformat-gfm" }

[settings]
python.uv_venv_auto = true

[env]
_.python.venv = { path = ".venv", create = true }

# This writes copilot session data to ./.cache which can aid in cost reporting.
COPILOT_OTEL_FILE_EXPORTER_PATH = "{{ config_root }}/.cache/copilot-otel/copilot-otel-{{ now() | date(format='%Y%m%d-%H%M%S') }}-{{ mise_pid }}.jsonl"
