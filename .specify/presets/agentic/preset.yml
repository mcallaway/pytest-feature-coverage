schema_version: "1.0"

preset:
  id: "agentic"
  name: "Agentic Workflow"
  version: "0.4.2" # x-release-please-version
  description: "Enriches Spec Kit core templates with TTL-aware project memory, rubric references, and decision capture prompts"
  repository: "https://github.com/bayer-int/speckit-agentic-workflow"
  license: "MIT"

requires:
  speckit_version: ">=0.16.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Append TTL metadata and rubric reference to feature specs"
      strategy: "append"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Append TTL metadata, rubric reference, and ADR reminder to plans"
      strategy: "append"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Append post-implementation review checkpoint to task lists"
      strategy: "append"

    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Append AGENTS.md cross-reference and docs/ scheme to constitution"
      strategy: "append"

tags:
  - "agentic"
  - "ttl"
  - "workflow"
  - "documentation"
  - "quality"
