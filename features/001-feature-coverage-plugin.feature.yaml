# Machine-readable requirements for the feature-coverage-plugin itself.
# This file is the source of truth for what the plugin promises.
# See docs/features/001-feature-coverage-plugin.md for human-readable context.

feature:
  id: "001"
  name: feature-coverage-plugin

components:
  YAML_SCHEMA:
    name: Feature YAML loading and validation
    requirements:
      1: Valid .feature.yaml files load and register requirements without error
      2: YAML files with missing or invalid fields fail collection with a clear error naming the file
      3: Duplicate feature names across YAML files fail collection with a clear error

  REQ_MARKER:
    name: req() test annotation marker
    requirements:
      1: Tests annotated with req() are associated with the specified requirement
      2: A single test may annotate multiple requirement IDs
      3: Orphan req() markers referencing unknown IDs emit a warning by default
      4: Orphan req() markers emit a collection error when feature_coverage_strict is true

  COVERAGE_REPORT:
    name: Coverage report generation
    requirements:
      1: --feature-coverage produces a text report grouped by feature and component
      2: Report output is deterministic for identical inputs
      3: When no feature YAML files exist the report shows Overall 0/0 without error

  CI_THRESHOLD:
    name: CI coverage threshold enforcement
    requirements:
      1: Process exits non-zero when coverage falls below --feature-coverage-min
      2: Process exits zero when coverage meets or exceeds the threshold
      3: Default threshold of 0 always passes

  OUTPUT_FORMATS:
    name: Machine-readable output formats
    requirements:
      1: --feature-coverage-format=json produces valid structured JSON to stdout
      2: --feature-coverage-format=markdown produces a deterministic markdown table

  CONFIGURATION:
    name: pyproject.toml configuration
    requirements:
      1: feature_yaml_paths INI option sets the default YAML search paths
      2: feature_coverage_min INI option sets the default coverage threshold
      3: feature_yaml_paths is required when --feature-coverage is active; omitting it emits a clear error

  COVERAGE_FILTER:
    name: Coverage report filtering by feature name
    requirements:
      1: "--feature-coverage-filter TEXT narrows the report to features whose name contains TEXT (case-insensitive); features not matching are omitted"
      2: When one or more filters are active the Overall totals and coverage percentage count only the filtered features' requirements
      3: "--feature-coverage-min threshold is evaluated against the filtered Overall percentage, not the full feature set's percentage"
      4: "Multiple --feature-coverage-filter flags combine as OR: a feature is shown if its name matches any of the provided substrings"
      5: "When no --feature-coverage-filter flags are passed, behaviour is identical to the unfiltered baseline (all features shown, no regressions)"
      6: Orphan req() marker detection is unaffected by the filter; orphans are checked against the full set of loaded features, not just the filtered subset
      7: "The --feature-coverage-filter option appears in pytest --help output with a clear, user-facing description"
      8: All three output format reporters (text, JSON, markdown) respect the filter and produce output scoped to the filtered feature set
      9: "Filtering to 0 matching features produces an empty report with Overall: 0/0 requirements covered (0.0%) and does not raise an error"

  EXECUTION_COVERAGE:
    name: Execution-aware coverage (a requirement is covered only by a genuine pass)
    requirements:
      1: A node ID with a clean setup/call/teardown pass is tracked as achieving a clean pass
      2: A node ID whose call phase fails is not tracked as a clean pass
      3: A node ID whose call phase is a plain skip is not tracked as a clean pass
      4: A node ID whose call phase is an expected xfail is not tracked as a clean pass
      5: A node ID whose call phase is an unexpected xpass is not tracked as a clean pass (deliberate policy, see ADR-006)
      6: A node ID whose setup phase errors is not tracked as a clean pass
      7: A node ID whose teardown phase errors is not tracked as a clean pass, even after a passing call phase
      8: Node IDs are tracked independently of one another
      9: A requirement is covered if and only if at least one of its associated node IDs achieved a clean pass; only clean-pass node IDs appear as covering evidence
      10: When multiple node IDs (including parametrized cases) reference the same requirement, one clean pass is enough to cover it and only the passing node ID(s) are listed as evidence
      11: "--feature-coverage-min is evaluated against execution-aware coverage and never hides pytest's own failing exit status"
      12: Text, JSON, and Markdown reports agree on total requirement count, covered count, percentage, and covering node IDs for the same run
      13: The plugin remains inert (no outcome tracking overhead) unless --feature-coverage is active
