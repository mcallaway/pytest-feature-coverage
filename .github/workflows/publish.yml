name: Publish to Artifactory

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. 0.1.4)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build
        run: uv build

      - name: Publish to Artifactory
        # Existing artifacts are skipped so a failed or partial release can be
        # safely retried; package indexes do not support replacing files.
        run: >-
          uv publish
          --index shared-python-prod-shared
          --check-url https://artifactory.bayer.com/artifactory/api/pypi/shared-python-prod-shared/simple
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.ARTIFACTORY_SECRET }}
